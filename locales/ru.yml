about:
  content: >
    # Об Инструментах кампуса

    Проект создан на основе открытого IT-Tools для студентов вузов. Он объединяет небольшие инструменты для учебы, подготовки документов и повседневной жизни в кампусе.

    Здесь можно находить свободные окна в расписании, считать средний балл и допустимое число пропусков, планировать экзамены и события, проверять документы по списку, оформлять библиографические ссылки, делить общие расходы и составлять график дежурств. Данные обрабатываются в браузере. Проверяйте результаты по официальным правилам учебного заведения и курса.

    ## Технологии

    Проект создан на Vue 3, TypeScript и Naive UI. При изменении и распространении проекта соблюдайте GPL-3.0, сохраняйте исходные уведомления об авторских правах и лицензии.

    ## Обратная связь

    Сообщить об ошибке или предложить новый инструмент можно в [репозитории GitHub](https://github.com/Riytl/it-tools).
