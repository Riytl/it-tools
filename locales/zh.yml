about:
  content: >
    # 关于校园工具箱

    校园工具箱基于开源项目 IT-Tools 改造，面向高校学生，把学习、材料整理和校园生活中常用的小工具放在同一个入口。

    课表与空档助手、成绩计算、考勤余量、考试事项、材料核对、参考文献格式、费用分摊和宿舍轮值，均在浏览器本地处理。请按学校和课程发布的正式规则核对计算结果。

    ## 技术

    项目使用 Vue 3、TypeScript 和 Naive UI 构建。修改代码和再发布时请遵守 GPL-3.0，并保留原项目的许可证与版权说明。

    ## 反馈与参与

    使用时发现问题或想到新的校园工具，可以在 [GitHub 仓库](https://github.com/Riytl/it-tools) 提交反馈。

