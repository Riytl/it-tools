about:
  content: >
    # About Campus Toolbox

    Campus Toolbox adapts the open-source IT-Tools project for university students, bringing together small tools for studying, preparing documents, and everyday campus life.

    Use it to find timetable gaps, calculate grades and attendance limits, track exams and events, check document requirements, format references, split shared expenses, and rotate dorm chores. Calculations stay in your browser. Verify results against official school and course rules.

    ## Technologies

    The project uses Vue 3, TypeScript, and Naive UI. Keep the original copyright and license notices, and follow GPL-3.0 when modifying and redistributing the project.

    ## Feedback and contributions

    Report a problem or suggest another campus tool in the [GitHub repository](https://github.com/Riytl/it-tools).

